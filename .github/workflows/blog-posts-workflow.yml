name: Latest blog posts workflow
on:
  push:
    branches: [ "master" ]
  schedule:
    # Runs every day
    - cron: '0 0 * * *'
  workflow_dispatch:

# Shared with the publications workflow, so the two never push at the same time.
concurrency: readme-update

jobs:
  update-readme-with-blog:
    name: Update this repo's README with the latest posts from my blog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@master
        with:
          comment_tag_name: "BLOG-POST-LIST"
          feed_list: "https://espositoandrea.github.io/feed.xml"
          max_post_count: 5
          commit_message: "Updated with the latest blog posts"
